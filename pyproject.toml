[project]
name = "ronovo-portfolio-auth"
version = "1.2.0"
description = "Portfolio login and security questions shared by the Ronovo portfolio apps."
license = "BSD-2-Clause"
requires-python = ">=3.10"
dependencies = ["pyjwt[crypto]>=2.8"]

[project.optional-dependencies]
dev = ["flask>=3", "pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
